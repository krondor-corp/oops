[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/krondor-corp/oops"
description = "Fast disk usage diagnostics for macOS and Unix"

[workspace.dependencies]
# Error handling
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive"] }
colored = "3"
crossterm = "0.29"

# Parallelism
rayon = "1"

# FFI (getattrlistbulk on macOS)
libc = "0.2"

# Utilities
bytesize = "2"

# Internal crates
oops-core = { path = "crates/oops-core" }
oops-cli = { path = "crates/oops-cli" }

# Release build with debug symbols, for `make profile`
[profile.profiling]
inherits = "release"
debug = true
